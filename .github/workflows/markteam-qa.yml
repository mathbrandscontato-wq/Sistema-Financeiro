name: Markteam QA (somente testes)
on:
  push:
    branches:
      - feat/markteam-automatico-v4
permissions:
  contents: read
concurrency:
  group: markteam-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'mathbrandscontato-wq/Sistema-Financeiro'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Instalar dependências congeladas
        run: pnpm install --frozen-lockfile
      - name: Teste markteam
        if: always()
        run: pnpm test:markteam
      - name: Teste leads
        if: always()
        run: pnpm test:leads
      - name: Teste protection
        if: always()
        run: pnpm test:protection
      - name: Teste commercial
        if: always()
        run: pnpm test:commercial
      - name: Teste crm
        if: always()
        run: pnpm test:crm
      - name: Teste finance
        if: always()
        run: pnpm test:finance
      - name: Teste dashboard
        if: always()
        run: pnpm test:dashboard
      - name: Teste intake
        if: always()
        run: pnpm test:intake
      - name: Teste evolution
        if: always()
        run: pnpm test:evolution
      - name: Teste operations
        if: always()
        run: pnpm test:operations
      - name: Teste forms
        if: always()
        run: pnpm test:forms
      - name: TypeScript
        if: always()
        run: pnpm exec tsc --noEmit
      - name: Lint
        if: always()
        run: pnpm lint
      - name: Build
        if: always()
        run: pnpm build

name: QA Automacao Comercial (sem deploy)

on:
  pull_request:
    branches:
      - fix/contract-deposit-seat-policy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercial-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, regressao e build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - name: Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Utilitarios para PDFs de regressao
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Biblioteca para comparacao visual de PDFs
        run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Verificar integridade do diff
        run: git diff --check
      - name: Instalar pnpm fixado pelo projeto
        uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - name: Dependencias travadas no lockfile
        run: |
          pnpm --version
          pnpm install --frozen-lockfile
      - name: Verificacao de tipos
        run: pnpm exec tsc --noEmit
      - name: Testes completos e build
        run: pnpm build

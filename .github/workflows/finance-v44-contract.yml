name: Financeiro V4.4 — contrato autenticado (somente testes)
on:
  pull_request:
    paths:
      - 'lib/ritmo-v44/**'
      - 'app/api/ritmo-v44/**'
      - 'qa/ritmo-v44-contract.mjs'
      - '.github/workflows/finance-v44-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node --test qa/ritmo-v44-contract.mjs
